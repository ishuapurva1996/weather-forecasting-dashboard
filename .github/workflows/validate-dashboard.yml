name: Validate weather dashboard
on:
  pull_request:
  push:
    branches: [main]
    paths: ['web_dashboard/**', 'scripts/**', 'plugins/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile dags/*.py plugins/*.py scripts/*.py web_dashboard/*.py
